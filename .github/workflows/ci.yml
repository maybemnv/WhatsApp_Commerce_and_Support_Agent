name: Fixture CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: ruff check apps tests
      - run: python -m pytest -q

  browser-fixture:
    name: Linux Playwright fixture with finalized reports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Install browser dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run fixture browser suite
        working-directory: e2e
        run: npm test

      - name: Verify finalized JSON and JUnit reports
        if: always()
        working-directory: e2e
        run: >-
          python -c "import json, pathlib, xml.etree.ElementTree as ET;
          data=json.loads(pathlib.Path('test-results/results.json').read_text());
          stats=data['stats'];
          assert stats['expected'] == 12 and stats['skipped'] == 0 and stats['unexpected'] == 0, stats;
          suite=ET.parse('test-results/results.xml').getroot();
          assert suite.attrib.get('tests') == '12' and suite.attrib.get('failures', '0') == '0' and suite.attrib.get('skipped', '0') == '0', suite.attrib"

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-linux-playwright
          path: |
            e2e/test-results/results.json
            e2e/test-results/results.xml
            e2e/test-results
          if-no-files-found: error

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag whatsapp-api:ci .
      - run: docker run --detach --name whatsapp-api --publish 8105:8105 --env APP_ENV=local-fixture whatsapp-api:ci
      - name: Verify container boot
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8105/ready && exit 0
            sleep 1
          done
          docker logs whatsapp-api
          exit 1
      - if: always()
        run: docker rm --force whatsapp-api
